<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two Sum - LeetCode</title>
  </head>
  <body>
    <div class="question-title-wrapper">
      <h1 data-cy="question-title">Two Sum</h1>
    </div>
    <div class="submission-result-panel">
      <div class="submission-status">Accepted</div>
      <div class="submission-meta">
        <span data-e2e-locator="submission-date">Submitted at Jan 2, 2026 10:00</span>
        <time datetime="2026-01-02T10:00:00Z">Jan 2, 2026</time>
      </div>
      <div class="submission-id" id="submission-id">Submission ID: 123456789</div>
    </div>
    <div class="lang-select" data-cy="lang-select">
      <span class="ant-select-selection-item">Python3</span>
    </div>
    <div class="editor">
      <div class="cm-content" contenteditable="true">
        <div class="cm-line">class Solution:</div>
        <div class="cm-line">    def twoSum(self, nums, target):</div>
        <div class="cm-line">        seen = {}</div>
        <div class="cm-line">        for i, n in enumerate(nums):</div>
        <div class="cm-line">            if target - n in seen:</div>
        <div class="cm-line">                return [seen[target - n], i]</div>
        <div class="cm-line">            seen[n] = i</div>
      </div>
    </div>
  </body>
</html>
